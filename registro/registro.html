<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta — AulaViva</title>

    <link
        rel="stylesheet"
        href="registro.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <main class="register-page">

        <section class="register-card">


            <!-- MARCA -->

            <div class="brand">

                <div class="brand-icon">
                    T/4
                </div>

                <div>

                    <h1>
                        AulaViva
                    </h1>

                    <span>
                        Monitoreo inteligente
                    </span>

                </div>

            </div>


            <!-- ENCABEZADO -->

            <div class="register-header">

                <h2>
                    Crear una cuenta
                </h2>

                <p>
                    Registrate para acceder al
                    sistema de monitoreo.
                </p>

            </div>


            <!-- REGISTRO -->

            <form
                action="registro.php"
                method="POST"
            >


                <!-- NOMBRE Y APELLIDO -->

                <div class="two-columns">


                    <div class="input-group">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Tu nombre"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="apellido">
                            Apellido
                        </label>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Tu apellido"
                            required
                        >

                    </div>


                </div>


                <!-- USUARIO -->

                <div class="input-group">

                    <label for="id_usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="id_usuario"
                        name="id_usuario"
                        placeholder="Elegí un nombre de usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- INSTITUCIÓN -->

                <div class="input-group">

                    <label for="institucion">

                        Institución

                        <span>
                            (opcional)
                        </span>

                    </label>

                    <input
                        type="text"
                        id="institucion"
                        name="institucion"
                        placeholder="Ej. EEST N° 4"
                    >

                </div>


                <!-- CONTRASEÑA -->

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- REPETIR CONTRASEÑA -->

                <div class="input-group">

                    <label for="password_confirm">
                        Repetir contraseña
                    </label>

                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        placeholder="Repetí tu contraseña"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- INFORMACIÓN DEL ROL -->

                <div class="role-info">

                    <div class="role-icon">
                        ✓
                    </div>

                    <div>

                        <strong>
                            Cuenta de estudiante
                        </strong>

                        <p>
                            Las cuentas nuevas se crean
                            como estudiante.
                            Un administrador puede cambiar
                            el rol posteriormente.
                        </p>

                    </div>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Crear cuenta
                </button>


            </form>


            <!-- LOGIN -->

            <div class="register-footer">

                <p>
                    ¿Ya tenés una cuenta?
                </p>

                <a href="../login/login.html">
                    Iniciar sesión
                </a>

            </div>


            <!-- HOME -->

            <a
                href="../home.html"
                class="back-home"
            >
                ← Volver al inicio
            </a>


        </section>

    </main>


    <script src="registro.js"></script>

</body>

</html>
